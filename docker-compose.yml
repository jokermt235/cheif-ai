services:
  nginx:
    container_name: server-nginx
    image: nginx:latest
    volumes:
      - /var/www/html/static:/usr/share/nginx/html/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - '80:80'
      - '443:443'
    restart: always
    depends_on:
      - backend
    networks:
      - default

  database:
    image: postgres:16-alpine
    container_name: storage-database
    restart: always
    env_file:
      - ./config/.env
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: ./services/Dockerfile
    image: django
    container_name: storage-backend
    restart: always
    depends_on:
      - database
    volumes:
      - ./services:/app
      - /var/www/html/media:/app/media
    env_file:
      - ./config/.env
    ports:
      - '8000:8000'
    command: sh -c "chmod +x /app/start.django.sh && sh /app/start.django.sh"
    networks:
      - default

      
  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    image: ai-service
    container_name: ai-service
    restart: always
    volumes:
      - ./ai-service:/app
    ports:
      - '8001:8001'
    networks:
      - default  

networks:
  default:
    driver: bridge