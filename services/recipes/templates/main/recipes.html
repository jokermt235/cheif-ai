<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChefAI - Turn your ingredients into meals!</title>
    <style>
        :root {
            --primary: #FF9F1C;
            --primary-light: #FFF5E6;
            --bg: #F4F9F6;
            --card-bg: #FFFFFF;
            --text: #0B2545;
            --text-muted: #627486;
            --danger: #9E2A2B;
            --danger-bg: #FFF0F1;
            --nav-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin: 20px 0 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #134074;
            font-weight: 800;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1.1rem;
        }

        .screen-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            width: 100%;
        }

        .screen-card h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .screen-card .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #F0F4F8;
            border-radius: 20px;
            padding: 5px 15px;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            background: #FFF;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 5px;
            font-size: 1.1rem;
            color: var(--text);
            outline: none;
        }

        .scan-btn-inline {
            background: #E1EBF5;
            border: none;
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            min-height: 30px;
        }

        .chip {
            background: #E2ECE9;
            color: #2D6A4F;
            padding: 8px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: fadeIn 0.2s ease;
        }

        .chip.green {
            background: #D8F3DC;
            color: #1B4332;
        }

        .chip .remove {
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            opacity: 0.6;
        }

        .chip .remove:hover {
            opacity: 1;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 159, 28, 0.25);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #E1EBF5;
            color: #134074;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .state-message {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1rem;
            display: none;
        }

        .state-message.info {
            background: #E3F2FD;
            color: #0D47A1;
        }

        .upload-placeholder {
            border: 2px dashed #CBD5E1;
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            margin-bottom: 20px;
            background: #FAFAFA;
        }

        .preview-image {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 20px;
            display: none;
            max-height: 250px;
            object-fit: cover;
        }

        .recipe-card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid #E9EFF5;
        }

        .recipe-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #134074;
        }

        .recipe-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-pill {
            background: #FFF5E6;
            color: #CC7A00;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .recipe-section-label {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 12px 0 6px;
        }

        .recipe-card ul, .recipe-card ol {
            padding-left: 20px;
            color: #334155;
            font-size: 1rem;
            line-height: 1.5;
        }

        .recipe-card li {
            margin-bottom: 4px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            border-top: 1px solid #EAEAEA;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: #2D6A4F;
        }

        .nav-icon {
            font-size: 1.4rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>ChefAI</h1>
            <p>Turn your ingredients into meals!</p>
        </header>

        <div id="state-message" class="state-message"></div>

        <main id="home-section">
            <div class="screen-card">
                <h2>What ingredients do you have?</h2>
                <div class="subtitle">Type ingredients manually or upload a photo of what you have at home.</div>

                <div class="input-wrapper">
                    <input type="text" id="ingredient-input" placeholder="e.g. milk, egg, butter">
                    <button class="scan-btn-inline" onclick="showUploadScreen()" title="Scan photo">📷</button>
                </div>

                <div id="ingredient-chips" class="chips-container"></div>

                <button class="btn-main" onclick="searchRecipes()">🪄 Generate Recipe</button>
            </div>
        </main>

        <section id="upload-section" style="display: none;" class="screen-card">
            <h2>Upload Ingredients Photo</h2>
            <div class="subtitle">Choose a photo and ChefAI will try to understand what ingredients are visible.</div>

            <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="handlePhotoPreview(event)">
            
            <div class="upload-placeholder" id="upload-placeholder" onclick="document.getElementById('photo-input').click()">
                <span style="font-size: 2.5rem; display:block; margin-bottom:10px;">📸</span>
                Tap to select or take a photo
            </div>

            <img id="preview-image" class="preview-image" alt="Preview">

            <button class="btn-main" onclick="searchByPhoto()">Analyze Photo</button>
            <button class="btn-secondary" onclick="showHomeScreen()">Back to Home</button>
        </section>

        <section id="results-section" style="display: none; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 1.5rem;">Recipe Ideas</h2>
                <span id="source-pill" class="meta-pill" style="background:#E8F5E9; color:#2E7D32;">AI</span>
            </div>
            <div id="results-subtitle" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;"></div>
            
            <div id="recipe-results"></div>
        </section>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="showHomeScreen()">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="showRecipesPage()">
            <span class="nav-icon">📖</span>
            <span>Recipes</span>
        </button>
        <button class="nav-item" onclick="showUploadScreen()">
            <span class="nav-icon">📷</span>
            <span>Scan</span>
        </button>
    </nav>

    <script>
        const chipsContainer = document.getElementById('ingredient-chips');
        const input = document.getElementById('ingredient-input');
        const stateMessage = document.getElementById('state-message');
        const resultsSection = document.getElementById('results-section');
        const recipeResults = document.getElementById('recipe-results');
        const uploadSection = document.getElementById('upload-section');
        const homeSection = document.getElementById('home-section');
        const photoInput = document.getElementById('photo-input');
        const previewImage = document.getElementById('preview-image');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const sourcePill = document.getElementById('source-pill');
        const resultsSubtitle = document.getElementById('results-subtitle');

        // Логика добавления ингредиентов по Enter
        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const value = input.value.trim();
                if (value !== '') {
                    addIngredient(value);
                    input.value = '';
                }
            }
        });

        // Удаление тегов по клику на крестик
        chipsContainer.addEventListener('click', function (event) {
            if (event.target.classList.contains('remove')) {
                event.target.parentElement.remove();
            }
        });

        // Создание визуального "чипса"
        function addIngredient(name) {
            if (!name) return;
            const cleanedName = name.trim();
            
            // Защита от дубликатов
            const existing = getIngredients().map(i => i.toLowerCase());
            if (existing.includes(cleanedName.toLowerCase())) return;

            const chip = document.createElement('div');
            chip.className = 'chip green';
            chip.dataset.name = cleanedName;
            chip.innerHTML = `🍳 ${capitalize(cleanedName)} <span class="remove">×</span>`;
            chipsContainer.appendChild(chip);
            hideMessage();
        }

        // Сбор всех добавленных ингредиентов
        function getIngredients() {
            return Array.from(document.querySelectorAll('.chip'))
                .map(chip => chip.dataset.name || chip.textContent.replace('×', '').replace('🍳', '').trim())
                .filter(Boolean);
        }

        function showMessage(message, isError = false) {
            stateMessage.textContent = message;
            stateMessage.className = isError ? 'state-message' : 'state-message info';
            stateMessage.style.display = 'block';
        }

        function hideMessage() {
            stateMessage.style.display = 'none';
        }

        function showUploadScreen() {
            uploadSection.style.display = 'block';
            homeSection.style.display = 'none';
            resultsSection.style.display = 'none';
            hideMessage();
            setActiveNav('Scan');
        }

        function showHomeScreen() {
            uploadSection.style.display = 'none';
            homeSection.style.display = 'block';
            hideMessage();
            setActiveNav('Home');
        }

        function showRecipesPage() {
            if (recipeResults.innerHTML.trim()) {
                uploadSection.style.display = 'none';
                homeSection.style.display = 'none';
                resultsSection.style.display = 'block';
                hideMessage();
                setActiveNav('Recipes');
            } else {
                showMessage('No generated recipes yet. Add ingredients on Home screen!', true);
            }
        }

        function setActiveNav(label) {
            document.querySelectorAll('.nav-item').forEach(item => {
                const text = item.textContent.trim();
                item.classList.toggle('active', text.includes(label));
            });
        }

        function handlePhotoPreview(event) {
            const file = event.target.files[0];
            if (!file) return;
            previewImage.src = URL.createObjectURL(file);
            previewImage.style.display = 'block';
            uploadPlaceholder.style.display = 'none';
        }

        // Поиск по текстовым тегам
        async function searchRecipes() {
            // Если пользователь ввел текст, но забыл нажать Enter перед поиском:
            if (input.value.trim() !== '') {
                addIngredient(input.value.trim());
                input.value = '';
            }

            const ingredients = getIngredients();
            if (ingredients.length === 0) {
                showMessage('Add at least one ingredient first.', true);
                return;
            }

            showMessage('ChefAI is finding recipes...');
            recipeResults.innerHTML = '';

            try {
                const query = encodeURIComponent(ingredients.join(','));
                const response = await fetch(`/api/search/?ingredients=${query}`);
                if (!response.ok) throw new Error('API failed');
                
                const data = await response.json();
                hideMessage();
                renderResults(data, 'text');
            } catch (error) {
                console.error(error);
                showMessage('Something went wrong. Please try again.', true);
            }
        }

        // Анализ по фотографии
        async function searchByPhoto() {
            const file = photoInput.files[0];
            if (!file) {
                showMessage('Please choose an image first.', true);
                return;
            }

            showMessage('Analyzing photo and generating recipes...');
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/storage/analyze/', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error('Analyze failed');

                const data = await response.json();
                hideMessage();
                renderResults(data, 'photo');
            } catch (error) {
                console.error(error);
                showMessage('Could not analyze this photo. Try another image.', true);
            }
        }

        function renderResults(data, mode) {
            const payload = data.data || data;
            const recipes = Array.isArray(payload) ? payload : (payload.recipes || []);

            if (recipes.length === 0 && !payload.instructions) {
                showMessage('No recipes found. Try different ingredients.', true);
                return;
            }

            resultsSubtitle.textContent = mode === 'photo' 
                ? 'Generated from your uploaded photo.' 
                : 'Generated from your ingredients.';

            homeSection.style.display = 'none';
            uploadSection.style.display = 'none';
            resultsSection.style.display = 'block';
            setActiveNav('Recipes');

            if (Array.isArray(recipes)) {
                recipeResults.innerHTML = recipes.map(createRecipeCard).join('');
            } else {
                recipeResults.innerHTML = createRecipeCard(payload);
            }
        }

        // Безопасное вытягивание текста из строки или объекта ингредиента
        function getIngredientText(item) {
            if (!item) return '';
            if (typeof item === 'string') return item;
            if (typeof item === 'object') {
                return item.name || item.title || item.ingredient || item.text || JSON.stringify(item);
            }
            return String(item);
        }

        function createRecipeCard(recipe) {
            const title = recipe.name || recipe.title || 'Delicious Recipe';
            const time = recipe.cookingTime || recipe.cooking_time || 'Quick';
            const difficulty = recipe.difficulty || 'Easy';
            
            // Парсинг массивов данных
            const rawIngredients = recipe.ingredients || recipe.ingredientsUsed || [];
            const ingredients = Array.isArray(rawIngredients) ? rawIngredients : [rawIngredients];
            
            const rawSteps = recipe.steps || recipe.instructions || [];
            const steps = Array.isArray(rawSteps) ? rawSteps : [rawSteps];

            return `
                <article class="recipe-card">
                    <h3>${escapeHtml(title)}</h3>
                    <div class="recipe-meta">
                        <span class="meta-pill">⏱ ${escapeHtml(String(time))}</span>
                        <span class="meta-pill">⭐ ${escapeHtml(String(difficulty))}</span>
                        <span class="meta-pill">Uses your ingredients</span>
                    </div>

                    ${ingredients.length ? `
                        <div class="recipe-section-label">Ingredients</div>
                        <ul>${ingredients.map(item => `<li>${escapeHtml(getIngredientText(item))}</li>`).join('')}</ul>
                    ` : ''}

                    ${steps.length ? `
                        <div class="recipe-section-label">Steps</div>
                        <ol>${steps.map(item => `<li>${escapeHtml(getIngredientText(item))}</li>`).join('')}</ol>
                    ` : ''}
                </article>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function capitalize(text) {
            return text.charAt(0).toUpperCase() + text.slice(1);
        }
    </script>
</body>
</html>
