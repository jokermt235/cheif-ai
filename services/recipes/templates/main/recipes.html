<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChefAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: sans-serif; }
        .app { max-width: 480px; margin: 40px auto; padding: 0 16px; }
        .logo { font-size: 32px; font-weight: 600; color: #212529; }
        .logo span { color: #2D7D46; }
        .card { border: 1px solid #e9ecef; border-radius: 16px; padding: 24px; background: white; }
        .btn-green { background: #2D7D46; color: white; border: none; border-radius: 10px; padding: 10px 20px; }
        .btn-green:hover { background: #236138; color: white; }
        .btn-outline-green { border: 1px solid #2D7D46; color: #2D7D46; border-radius: 10px; padding: 10px 20px; background: white; }
        .btn-outline-green:hover { background: #f0faf3; }
        .file-label { border: 1px dashed #adb5bd; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; color: #6c757d; font-size: 14px; }
        .file-label:hover { border-color: #2D7D46; color: #2D7D46; }
        .recipe-card { background: #f8f9fa; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #e9ecef; }
        .recipe-name { font-size: 16px; font-weight: 500; }
        .recipe-ing { font-size: 13px; color: #6c757d; margin-top: 4px; }
        .badge-ai { background: #e8f5ec; color: #2D7D46; font-size: 11px; padding: 3px 10px; border-radius: 20px; }
        .badge-db { background: #e8f0fb; color: #1a56a0; font-size: 11px; padding: 3px 10px; border-radius: 20px; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: #adb5bd; font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e9ecef; }
        input[type=file] { display: none; }
        #filename { font-size: 12px; color: #2D7D46; margin-top: 6px; }
    </style>
</head>
<body>

<div class="app">
    <div class="mb-4">
        <div class="logo">Chef<span>AI</span></div>
        <div class="text-muted" style="font-size:14px;">Найди рецепт по ингредиентам</div>
    </div>

    <div class="card mb-4">
        <div class="fw-500 mb-1" style="font-size:15px;">Что есть дома?</div>
        <div class="text-muted mb-3" style="font-size:13px;">Введи ингредиенты или загрузи фото</div>

        <div class="input-group mb-2">
            <input type="text" id="query" class="form-control" placeholder="молоко яйца мука...">
            <button class="btn btn-green" onclick="search()">Найти</button>
        </div>

        <div class="divider">или</div>

        <label class="file-label w-100" for="photo">
            📷 Загрузить фото продуктов
        </label>
        <input type="file" id="photo" accept="image/*" onchange="onFileChange()">
        <div id="filename"></div>

        <button class="btn btn-outline-green w-100 mt-3" onclick="searchByPhoto()">
            🔍 Найти по фото
        </button>
    </div>

    <div id="results"></div>
</div>

<script>
    function onFileChange() {
        const file = document.getElementById('photo').files[0];
        document.getElementById('filename').textContent = file ? '📎 ' + file.name : '';
    }

    async function search() {
        const query = document.getElementById('query').value.trim();
        if (!query) return;
        showLoading();
        try {
            const res = await fetch(`/api/search/?ingredients=${encodeURIComponent(query)}`);
            const response = await res.json();
            showResults(response.data || response, response.source || 'db');
        } catch(e) { showError(); }
    }

    async function searchByPhoto() {
        const file = document.getElementById('photo').files[0];
        if (!file) { alert('Выбери фото!'); return; }
        showLoading();
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/api/storage/analyze', { method: 'POST', body: formData });
            const response = await res.json();
            if (!response.success) { showError(response.error); return; }
            showResults(response.data.recipes, 'ai');
        } catch(e) { showError(); }
    }

    function showLoading() {
        document.getElementById('results').innerHTML = '<div class="text-center text-muted py-4">Ищем рецепты...</div>';
    }

    function showError(msg) {
        document.getElementById('results').innerHTML = `<div class="text-center text-muted py-4">${msg || 'Что-то пошло не так'}</div>`;
    }

    function showResults(recipes, source) {
        const container = document.getElementById('results');
        if (!recipes || !recipes.length) {
            container.innerHTML = '<div class="text-center text-muted py-4">Рецепты не найдены</div>';
            return;
        }
        const badge = source === 'ai'
            ? '<span class="badge-ai">от ИИ</span>'
            : '<span class="badge-db">из базы</span>';
        container.innerHTML = recipes.map(r => `
            <div class="recipe-card">
                ${badge}
                <div class="recipe-name mt-1">${r.name}</div>
                <div class="recipe-ing">${Array.isArray(r.ingredients) ? r.ingredients.map(i => i.name || i).join(', ') : ''}</div>
            </div>
        `).join('');
    }

    document.getElementById('query').addEventListener('keypress', e => {
        if (e.key === 'Enter') search();
    });
</script>

</body>
</html>
