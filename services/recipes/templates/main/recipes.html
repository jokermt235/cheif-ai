<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рецепты</title>
</head>
<body>
    <h1>Поиск рецептов</h1>

    <!-- Поиск текстом -->
    <input type="text" id="query" placeholder="молоко яйца мука">
    <button onclick="search()">Найти</button>

    <br><br>

    <!-- Поиск по фото -->
    <input type="file" id="photo" accept="image/*">
    <button onclick="searchByPhoto()">Найти по фото</button>

    <div id="results"></div>

    <script>
        // Поиск по тексту
        async function search() {
            const query = document.getElementById('query').value.trim();
            if (!query) return;

            const res = await fetch(`/api/search/?ingredients=${encodeURIComponent(query)}`);
            const response = await res.json();
            showResults(response.data || response);
        }

        // Поиск по фото
        async function searchByPhoto() {
            const file = document.getElementById('photo').files[0];
            if (!file) return alert('Выбери фото!');

            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch('/api/storage/analyze', {
                method: 'POST',
                body: formData
            });
            const response = await res.json();

            if (!response.success) {
                document.getElementById('results').innerHTML = `<p>Ошибка: ${response.error}</p>`;
                return;
            }

            // Показываем рецепты от ИИ
            showResults(response.data.recipes);
        }

        function showResults(recipes) {
            const container = document.getElementById('results');

            if (!recipes || !recipes.length) {
                container.innerHTML = '<p>Рецепты не найдены</p>';
                return;
            }

            container.innerHTML = recipes.map(r => `
                <div>
                    <h3>${r.name}</h3>
                    <p>${Array.isArray(r.ingredients) ? r.ingredients.map(i => i.name || i).join(', ') : ''}</p>
                </div>
            `).join('');
        }

        document.getElementById('query').addEventListener('keypress', e => {
            if (e.key === 'Enter') search();
        });
    </script>
</body>
</html>
